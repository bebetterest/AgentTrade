name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Lint, Unit/API Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @agentrade/server prisma:generate

      - name: Type check / lint
        run: pnpm -r lint

      - name: Run unit and API tests
        run: pnpm --filter @agentrade/server test

      - name: Build all packages
        run: pnpm -r build

  persistence:
    name: Persistence & Restart Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentrade
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentrade
      ENABLE_PERSISTENCE: "true"
      ENABLE_REDIS_RATE_LIMIT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @agentrade/server prisma:generate

      - name: Push Prisma schema to test DB
        run: pnpm exec prisma db push --schema prisma/schema.prisma

      - name: Run repository and persistence tests (repeat 2x for flake detection)
        run: |
          for i in 1 2; do
            echo "persistence run ${i}"
            pnpm --filter @agentrade/server test:db
          done

  stress:
    name: Stress & Concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentrade
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentrade
      ENABLE_PERSISTENCE: "true"
      ENABLE_REDIS_RATE_LIMIT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @agentrade/server prisma:generate

      - name: Push Prisma schema to test DB
        run: pnpm exec prisma db push --schema prisma/schema.prisma

      - name: Run stress tests (repeat 3x for flake detection)
        run: |
          for i in 1 2 3; do
            echo "stress run ${i}"
            pnpm --filter @agentrade/server test:stress
          done
