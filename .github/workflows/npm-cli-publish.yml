name: Publish CLI To npm

on:
  push:
    branches: ["main"]
    paths:
      - "apps/cli/package.json"
  workflow_dispatch:

jobs:
  publish-cli:
    name: Publish @agentrade/cli
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_PACKAGE_NAME: "@agentrade/cli"
      CLI_PACKAGE_JSON: ./apps/cli/package.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect CLI version change
        id: version-change
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            echo "Manual trigger: publish enabled."
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            echo "No usable before SHA; publish enabled."
            exit 0
          fi

          BEFORE_JSON="$(git show "${BEFORE}:apps/cli/package.json" 2>/dev/null || true)"
          BEFORE_VERSION="$(printf "%s" "${BEFORE_JSON}" | node -pe "const fs=require('fs'); const s=fs.readFileSync(0,'utf8').trim(); if(!s){process.exit(0)}; JSON.parse(s).version" 2>/dev/null || true)"
          AFTER_VERSION="$(node -p "require('./apps/cli/package.json').version")"

          echo "before_version=${BEFORE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "after_version=${AFTER_VERSION}" >> "${GITHUB_OUTPUT}"

          if [ -z "${BEFORE_VERSION}" ]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            echo "Could not resolve previous version; publish enabled."
          elif [ "${BEFORE_VERSION}" != "${AFTER_VERSION}" ]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            echo "Version changed: ${BEFORE_VERSION} -> ${AFTER_VERSION}"
          else
            echo "version_changed=false" >> "${GITHUB_OUTPUT}"
            echo "Version unchanged (${AFTER_VERSION}); publish skipped."
          fi

      - name: Setup pnpm
        if: steps.version-change.outputs.version_changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Setup Node.js
        if: steps.version-change.outputs.version_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Validate publish inputs
        if: steps.version-change.outputs.version_changed == 'true'
        run: |
          test -n "${NPM_TOKEN}" || { echo "Missing required secret: NPM_TOKEN"; exit 1; }
          test -f "${CLI_PACKAGE_JSON}" || { echo "Missing ${CLI_PACKAGE_JSON}"; exit 1; }

      - name: Resolve CLI version
        if: steps.version-change.outputs.version_changed == 'true'
        id: cli-meta
        run: |
          CLI_VERSION="$(node -p "require('${CLI_PACKAGE_JSON}').version")"
          test -n "${CLI_VERSION}" || { echo "Failed to resolve CLI version"; exit 1; }
          echo "version=${CLI_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved CLI version: ${CLI_VERSION}"

      - name: Check npm version availability
        if: steps.version-change.outputs.version_changed == 'true'
        id: npm-check
        env:
          CLI_VERSION: ${{ steps.cli-meta.outputs.version }}
        run: |
          set -euo pipefail
          ERR_FILE="$(mktemp)"
          if npm view "${NPM_PACKAGE_NAME}@${CLI_VERSION}" version --registry https://registry.npmjs.org/ >/dev/null 2>"${ERR_FILE}"; then
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
            echo "Version already exists on npm: ${NPM_PACKAGE_NAME}@${CLI_VERSION}"
          elif grep -Eq "E404|404 Not Found|is not in this registry" "${ERR_FILE}"; then
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
            echo "Version not found on npm: ${NPM_PACKAGE_NAME}@${CLI_VERSION}"
          else
            echo "npm view failed unexpectedly while checking ${NPM_PACKAGE_NAME}@${CLI_VERSION}"
            cat "${ERR_FILE}"
            exit 1
          fi
          rm -f "${ERR_FILE}"

      - name: Install dependencies
        if: steps.version-change.outputs.version_changed == 'true' && steps.npm-check.outputs.should_publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish CLI package
        if: steps.version-change.outputs.version_changed == 'true' && steps.npm-check.outputs.should_publish == 'true'
        working-directory: ./apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm publish --access public --publish-branch main --tag latest

      - name: Output publish target
        if: steps.version-change.outputs.version_changed == 'true' && steps.npm-check.outputs.should_publish == 'true'
        env:
          CLI_VERSION: ${{ steps.cli-meta.outputs.version }}
        run: |
          echo "Published target: https://www.npmjs.com/package/${NPM_PACKAGE_NAME}/v/${CLI_VERSION}"

      - name: Skip publish (version unchanged)
        if: steps.version-change.outputs.version_changed != 'true'
        run: |
          echo "apps/cli/package.json changed but version stayed the same."
          echo "Skip publishing to npm."

      - name: Skip publish (version already exists)
        if: steps.version-change.outputs.version_changed == 'true' && steps.npm-check.outputs.should_publish != 'true'
        env:
          CLI_VERSION: ${{ steps.cli-meta.outputs.version }}
        run: |
          echo "npm already has ${NPM_PACKAGE_NAME}@${CLI_VERSION}."
          echo "Skip publishing to npm."
