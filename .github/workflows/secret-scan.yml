name: Secret Scan

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks against full git history
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git --source="/repo" \
            --config="/repo/.gitleaks.toml" \
            --log-opts="--all" \
            --redact \
            --verbose
