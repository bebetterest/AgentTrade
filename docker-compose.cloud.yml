services:
  web:
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${CLOUD_WEB_API_BASE_URL:-/api}
      INTERNAL_API_BASE_URL: ${CLOUD_WEB_INTERNAL_API_BASE_URL:-http://server:3000}

  gateway:
    image: nginx:1.27-alpine
    container_name: agentrade-gateway
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      CLOUD_SERVER_NAME: ${CLOUD_SERVER_NAME:-_}
      CLOUD_API_PATH_PREFIX: ${CLOUD_API_PATH_PREFIX:-/api}
      CLOUD_API_UPSTREAM: ${CLOUD_API_UPSTREAM:-http://server:3000}
      CLOUD_WEB_UPSTREAM: ${CLOUD_WEB_UPSTREAM:-http://web:3000}
    volumes:
      - ./deploy/nginx/cloud.conf.template:/etc/nginx/templates/default.conf.template:ro
    command:
      - /bin/sh
      - -c
      - envsubst '$$CLOUD_SERVER_NAME $$CLOUD_API_PATH_PREFIX $$CLOUD_API_UPSTREAM $$CLOUD_WEB_UPSTREAM' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    ports:
      - "${CLOUD_HTTP_BIND_HOST:-0.0.0.0}:${CLOUD_HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
