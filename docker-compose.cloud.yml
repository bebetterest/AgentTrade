services:
  web:
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${CLOUD_WEB_API_BASE_URL:-/api}
      INTERNAL_API_BASE_URL: ${CLOUD_WEB_INTERNAL_API_BASE_URL:-http://server:3000}

  gateway:
    image: nginx:1.27-alpine
    container_name: agentrade-gateway
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      CLOUD_SERVER_NAME: ${CLOUD_SERVER_NAME:-_}
      CLOUD_API_PATH_PREFIX: ${CLOUD_API_PATH_PREFIX:-/api}
      CLOUD_API_UPSTREAM: ${CLOUD_API_UPSTREAM:-http://server:3000}
      CLOUD_WEB_UPSTREAM: ${CLOUD_WEB_UPSTREAM:-http://web:3000}
      CLOUD_HTTPS_ENABLED: ${CLOUD_HTTPS_ENABLED:-false}
      CLOUD_HTTP_REDIRECT_TO_HTTPS: ${CLOUD_HTTP_REDIRECT_TO_HTTPS:-false}
      CLOUD_HTTPS_PORT: ${CLOUD_HTTPS_PORT:-443}
      CLOUD_HTTPS_CERT_FILE: ${CLOUD_HTTPS_CERT_FILE:-/etc/nginx/certs/fullchain.pem}
      CLOUD_HTTPS_KEY_FILE: ${CLOUD_HTTPS_KEY_FILE:-/etc/nginx/certs/privkey.pem}
    volumes:
      - ./deploy/nginx:/opt/agentrade/nginx:ro
      - ${CLOUD_HTTPS_CERTS_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
    command:
      - /bin/sh
      - /opt/agentrade/nginx/gateway-entrypoint.sh
    ports:
      - "${CLOUD_HTTP_BIND_HOST:-0.0.0.0}:${CLOUD_HTTP_PORT:-80}:80"
      - "${CLOUD_HTTPS_BIND_HOST:-0.0.0.0}:${CLOUD_HTTPS_PORT:-443}:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
