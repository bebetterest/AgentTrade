x-server-environment: &server-environment
  APP_NAME: ${APP_NAME:-Agentrade}
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HOST: ${HOST:-0.0.0.0}
  PORT: ${PORT:-3000}
  API_DEFAULT_VERSION: ${API_DEFAULT_VERSION:-v2}
  JWT_SECRET: ${JWT_SECRET:-replace-this-secret}
  ADMIN_SERVICE_KEY: ${ADMIN_SERVICE_KEY:-replace-this-admin-key}
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/agentrade}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  ENABLE_PERSISTENCE: ${ENABLE_PERSISTENCE:-true}
  ENABLE_REDIS_RATE_LIMIT: ${ENABLE_REDIS_RATE_LIMIT:-true}
  ENABLE_REQUEST_LOG_PERSISTENCE: ${ENABLE_REQUEST_LOG_PERSISTENCE:-true}
  ENABLE_AUDIT_LOG_PERSISTENCE: ${ENABLE_AUDIT_LOG_PERSISTENCE:-true}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
  AUTH_CHALLENGE_TTL_MINUTES: ${AUTH_CHALLENGE_TTL_MINUTES:-10}
  AUTH_CHALLENGE_MAX_ENTRIES: ${AUTH_CHALLENGE_MAX_ENTRIES:-10000}
  AUTH_CHALLENGE_SWEEP_INTERVAL_MS: ${AUTH_CHALLENGE_SWEEP_INTERVAL_MS:-30000}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
  RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-60}
  TASK_TITLE_MAX_LENGTH: ${TASK_TITLE_MAX_LENGTH:-200}
  TASK_DESCRIPTION_MAX_LENGTH: ${TASK_DESCRIPTION_MAX_LENGTH:-20000}
  TASK_ACCEPTANCE_CRITERIA_MAX_LENGTH: ${TASK_ACCEPTANCE_CRITERIA_MAX_LENGTH:-8000}
  TASK_SUBMISSION_PAYLOAD_MAX_LENGTH: ${TASK_SUBMISSION_PAYLOAD_MAX_LENGTH:-20000}
  TASK_SUBMISSION_ATTACHMENT_MAX_COUNT: ${TASK_SUBMISSION_ATTACHMENT_MAX_COUNT:-10}
  TASK_SUBMISSION_ATTACHMENT_NAME_MAX_LENGTH: ${TASK_SUBMISSION_ATTACHMENT_NAME_MAX_LENGTH:-200}
  TASK_SUBMISSION_ATTACHMENT_URL_MAX_LENGTH: ${TASK_SUBMISSION_ATTACHMENT_URL_MAX_LENGTH:-2000}
  TASK_SUBMISSION_ATTACHMENT_MAX_SIZE_BYTES: ${TASK_SUBMISSION_ATTACHMENT_MAX_SIZE_BYTES:-104857600}
  DISPUTE_REASON_MAX_LENGTH: ${DISPUTE_REASON_MAX_LENGTH:-4000}
  TASK_SLOTS_MAX: ${TASK_SLOTS_MAX:-100}
  TASK_REWARD_PER_SLOT_MAX: ${TASK_REWARD_PER_SLOT_MAX:-1000000}
  TASK_DEADLINE_MAX_HOURS: ${TASK_DEADLINE_MAX_HOURS:-4320}
  TAX_RATE_BPS: ${TAX_RATE_BPS:-500}
  TAX_MIN: ${TAX_MIN:-1}
  REWARD_MIN: ${REWARD_MIN:-1}
  INITIAL_AGENT_BALANCE: ${INITIAL_AGENT_BALANCE:-1000}
  MINT_PER_CYCLE: ${MINT_PER_CYCLE:-10000}
  CYCLE_DURATION_HOURS: ${CYCLE_DURATION_HOURS:-168}
  TASK_COMPLETION_PUBLISHER_WORKLOAD: ${TASK_COMPLETION_PUBLISHER_WORKLOAD:-0.25}
  TASK_COMPLETION_WORKER_WORKLOAD: ${TASK_COMPLETION_WORKER_WORKLOAD:-0.25}
  TERMINATION_PENALTY_BPS: ${TERMINATION_PENALTY_BPS:-1000}
  SUBMISSION_TIMEOUT_HOURS: ${SUBMISSION_TIMEOUT_HOURS:-72}
  RESUBMIT_COOLDOWN_MINUTES: ${RESUBMIT_COOLDOWN_MINUTES:-30}
  DISPUTE_QUORUM: ${DISPUTE_QUORUM:-5}
  DISPUTE_APPROVAL_BPS: ${DISPUTE_APPROVAL_BPS:-6000}
  REPUTATION_WEIGHT_PUBLISHER_BPS: ${REPUTATION_WEIGHT_PUBLISHER_BPS:-2000}
  REPUTATION_WEIGHT_WORKER_BPS: ${REPUTATION_WEIGHT_WORKER_BPS:-3000}
  REPUTATION_WEIGHT_SUPERVISOR_BPS: ${REPUTATION_WEIGHT_SUPERVISOR_BPS:-5000}
  SCORE_WEIGHT_REPUTATION_BPS: ${SCORE_WEIGHT_REPUTATION_BPS:-4500}
  SCORE_WEIGHT_COMPLETION_BPS: ${SCORE_WEIGHT_COMPLETION_BPS:-3500}
  SCORE_WEIGHT_QUALITY_BPS: ${SCORE_WEIGHT_QUALITY_BPS:-2000}
  BRIDGE_CHAIN: ${BRIDGE_CHAIN:-Base Sepolia}
  REQUEST_LOG_RETENTION_DAYS: ${REQUEST_LOG_RETENTION_DAYS:-30}
  AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-180}
  LOG_CLEANUP_INTERVAL_MINUTES: ${LOG_CLEANUP_INTERVAL_MINUTES:-60}
  LOG_CLEANUP_BATCH_SIZE: ${LOG_CLEANUP_BATCH_SIZE:-1000}
  CYCLE_CLOSE_POLL_INTERVAL_MS: ${CYCLE_CLOSE_POLL_INTERVAL_MS:-30000}
  REQUEST_LOG_BATCH_SIZE: ${REQUEST_LOG_BATCH_SIZE:-200}
  REQUEST_LOG_FLUSH_INTERVAL_MS: ${REQUEST_LOG_FLUSH_INTERVAL_MS:-100}
  REQUEST_LOG_BUFFER_CAPACITY: ${REQUEST_LOG_BUFFER_CAPACITY:-10000}

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentrade}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentrade}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: agentrade-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    image: agentrade-server:latest
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: agentrade-server
    restart: unless-stopped
    environment:
      <<: *server-environment
      SERVER_RUNTIME_ROLE: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/v2/system/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  worker:
    image: agentrade-server:latest
    container_name: agentrade-worker
    restart: unless-stopped
    environment:
      <<: *server-environment
      SERVER_RUNTIME_ROLE: worker
    depends_on:
      server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_AGENT_SKILLS_INSTALL_COMMAND: ${NEXT_PUBLIC_AGENT_SKILLS_INSTALL_COMMAND:-codex skill install ./apps/skill}
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://server:3000}
    container_name: agentrade-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_AGENT_SKILLS_INSTALL_COMMAND: ${NEXT_PUBLIC_AGENT_SKILLS_INSTALL_COMMAND:-codex skill install ./apps/skill}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://server:3000}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
