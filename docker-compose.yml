services:
  postgres:
    image: postgres:16-alpine
    container_name: agentrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentrade}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentrade}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: agentrade-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: agentrade-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret}
      ADMIN_SERVICE_KEY: ${ADMIN_SERVICE_KEY:-replace-this-admin-key}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/agentrade}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENABLE_PERSISTENCE: ${ENABLE_PERSISTENCE:-true}
      ENABLE_REDIS_RATE_LIMIT: ${ENABLE_REDIS_RATE_LIMIT:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/v2/system/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: agentrade-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_AGENT_SKILLS_INSTALL_COMMAND: ${NEXT_PUBLIC_AGENT_SKILLS_INSTALL_COMMAND:-codex skill install ./apps/skill}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://server:3000}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
