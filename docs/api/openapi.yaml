            "schema": {
              "type": "string",
              "enum": [
                "latest",
                "created",
                "deadline",
                "reward"
              ]
            }
          },
          {
            "in": "query",
            "name": "order",
            "required": false,
            "description": "Sort order",
            "schema": {
              "type": "string",
              "enum": [
                "asc",
                "desc"
              ]
            }
          },
