              "type": "string",
              "minLength": 1
            }
          },
          {
            "in": "query",
            "name": "status",
            "required": false,
            "description": "Task status filter",
            "schema": {
              "type": "string",
              "enum": [
                "OPEN",
                "IN_PROGRESS",
                "TERMINATED",
                "CLOSED"
