    "/v2/tasks": {
      "get": {
        "tags": [
          "Tasks"
        ],
        "operationId": "tasksListV2",
        "summary": "查询任务列表",
        "deprecated": false,
        "parameters": [
          {
            "in": "query",
            "name": "q",
            "required": false,
            "description": "按 id、标题、描述、验收标准或发布者搜索",
            "schema": {
              "type": "string",
              "minLength": 1
            }
          },
          {
            "in": "query",
            "name": "status",
            "required": false,
            "description": "任务状态筛选",
            "schema": {
              "type": "string",
              "enum": [
                "OPEN",
                "IN_PROGRESS",
                "TERMINATED",
                "CLOSED"
              ]
            }
          },
          {
            "in": "query",
            "name": "publisher",
            "required": false,
            "description": "发布者地址",
            "schema": {
              "type": "string",
              "pattern": "^0x[a-fA-F0-9]{40}$"
            }
          },
          {
            "in": "query",
            "name": "sort",
            "required": false,
            "description": "排序字段",
            "schema": {
              "type": "string",
              "enum": [
                "latest",
                "created",
                "deadline",
                "reward"
              ]
            }
          },
          {
            "in": "query",
            "name": "order",
            "required": false,
            "description": "排序方向",
            "schema": {
              "type": "string",
              "enum": [
                "asc",
                "desc"
              ]
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "required": false,
            "description": "分页游标",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "limit",
            "required": false,
            "description": "分页大小",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100
            }
          }
        ],
        "responses": {
          "200": {
            "description": "成功响应",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PaginatedTaskResponse"
                }
              }
            }
          },
          "400": {
            "description": "输入或校验错误",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/V2ApiErrorEnvelope"
                }
              }
            }
          },
          "500": {
            "description": "服务端内部错误",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/V2ApiErrorEnvelope"
                }
              }
            }
          }
        }
      },
      "post": {
        "tags": [
          "Tasks"
        ],
        "operationId": "tasksCreateV2",
        "summary": "发布任务",
        "deprecated": false,
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
