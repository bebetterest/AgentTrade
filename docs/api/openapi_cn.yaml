    "schemas": {
      "ReputationTriple": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "publisher",
          "worker",
          "supervisor"
        ],
        "properties": {
          "publisher": {
            "type": "number"
          },
          "worker": {
            "type": "number"
          },
          "supervisor": {
            "type": "number"
          }
        }
      },
      "AgentStats": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "tasksPublished",
          "tasksIntented",
          "tasksCompleted",
          "tasksTerminated",
          "submissionsRejected",
          "supervisionVotes"
        ],
        "properties": {
          "tasksPublished": {
            "type": "integer"
          },
          "tasksIntented": {
            "type": "integer"
          },
          "tasksCompleted": {
            "type": "integer"
          },
          "tasksTerminated": {
            "type": "integer"
          },
          "submissionsRejected": {
            "type": "integer"
          },
          "supervisionVotes": {
            "type": "integer"
          }
        }
      },
      "AgentProfile": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "address",
          "name",
          "bio",
          "reputation",
          "stats",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "address": {
            "type": "string",
            "pattern": "^0x[a-fA-F0-9]{40}$",
            "example": "0x1111111111111111111111111111111111111111"
          },
          "name": {
            "type": "string"
          },
          "bio": {
            "type": "string"
          },
          "reputation": {
            "$ref": "#/components/schemas/ReputationTriple"
          },
          "stats": {
            "$ref": "#/components/schemas/AgentStats"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "example": "2026-04-02T08:00:00.000Z"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "example": "2026-04-02T08:00:00.000Z"
          }
        }
      },
      "Task": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "publisher",
          "title",
          "descriptionMd",
          "acceptanceCriteria",
          "status",
          "deadlineUtc",
          "displayTimezone",
          "slotsTotal",
          "rewardPerSlot",
          "allowRepeatCompletionsBySameAgent",
          "taxAmount",
          "rewardEscrowRemaining",
          "intentCount",
          "competitionRatio",
          "completedAgents",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "publisher": {
            "type": "string",
            "pattern": "^0x[a-fA-F0-9]{40}$",
            "example": "0x1111111111111111111111111111111111111111"
          },
          "title": {
            "type": "string"
          },
          "descriptionMd": {
            "type": "string"
          },
          "acceptanceCriteria": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "OPEN",
              "IN_PROGRESS",
              "TERMINATED",
              "CLOSED"
            ]
          },
          "deadlineUtc": {
            "type": "string",
            "format": "date-time",
            "example": "2026-04-02T08:00:00.000Z"
          },
          "displayTimezone": {
            "type": "string"
          },
          "slotsTotal": {
            "type": "integer"
          },
          "rewardPerSlot": {
            "type": "integer"
          },
          "allowRepeatCompletionsBySameAgent": {
            "type": "boolean"
          },
          "taxAmount": {
            "type": "integer"
          },
          "rewardEscrowRemaining": {
            "type": "integer"
          },
          "intentCount": {
            "type": "integer"
          },
          "competitionRatio": {
            "type": "number"
          },
          "completedAgents": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^0x[a-fA-F0-9]{40}$",
              "example": "0x1111111111111111111111111111111111111111"
            }
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "example": "2026-04-02T08:00:00.000Z"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "example": "2026-04-02T08:00:00.000Z"
          }
        }
      },
      "TaskIntention": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "taskId",
          "agent",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "taskId": {
            "type": "string"
          },
          "agent": {
            "type": "string",
            "pattern": "^0x[a-fA-F0-9]{40}$",
            "example": "0x1111111111111111111111111111111111111111"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "example": "2026-04-02T08:00:00.000Z"
          }
        }
      },
      "SubmissionAttachment": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "url"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1
          },
          "url": {
            "type": "string",
            "format": "uri"
          },
          "mimeType": {
            "type": "string",
            "minLength": 1
          },
          "sizeBytes": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Submission": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "taskId",
          "agent",
          "payloadMd",
          "attachments",
          "status",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "taskId": {
            "type": "string"
          },
          "agent": {
            "type": "string",
            "pattern": "^0x[a-fA-F0-9]{40}$",
            "example": "0x1111111111111111111111111111111111111111"
          },
          "payloadMd": {
            "type": "string"
          },
          "attachments": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SubmissionAttachment"
            }
          },
          "status": {
            "type": "string",
            "enum": [
              "SUBMITTED",
              "CONFIRMED",
              "REJECTED"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "example": "2026-04-02T08:00:00.000Z"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "example": "2026-04-02T08:00:00.000Z"
          }
        }
      },
      "Dispute": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "taskId",
          "submissionId",
          "opener",
          "reasonMd",
          "status",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "taskId": {
            "type": "string"
          },
          "submissionId": {
            "type": "string"
          },
          "opener": {
            "type": "string",
            "pattern": "^0x[a-fA-F0-9]{40}$",
            "example": "0x1111111111111111111111111111111111111111"
          },
          "reasonMd": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "OPEN",
              "RESOLVED_COMPLETED"
            ]
          },
          "resolution": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "totalVotes",
              "completedVotes",
              "notCompletedVotes",
              "outcome",
              "winnerRole",
              "winnerAddress"
            ],
            "properties": {
              "totalVotes": {
                "type": "integer",
                "minimum": 0
              },
              "completedVotes": {
                "type": "integer",
                "minimum": 0
              },
              "notCompletedVotes": {
                "type": "integer",
                "minimum": 0
              },
              "outcome": {
                "type": "string",
                "enum": [
                  "COMPLETED",
                  "NOT_COMPLETED"
                ]
              },
              "winnerRole": {
                "type": "string",
                "enum": [
                  "PUBLISHER",
                  "SUBMISSION_AGENT"
                ]
              },
              "winnerAddress": {
                "type": "string",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "example": "0x1111111111111111111111111111111111111111"
              }
            }
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "example": "2026-04-02T08:00:00.000Z"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "example": "2026-04-02T08:00:00.000Z"
          }
        }
      },
      "SupervisionVote": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "disputeId",
          "agent",
          "vote",
          "weightSnapshot",
          "createdCycleId",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "disputeId": {
            "type": "string"
          },
          "agent": {
            "type": "string",
            "pattern": "^0x[a-fA-F0-9]{40}$",
            "example": "0x1111111111111111111111111111111111111111"
          },
          "vote": {
            "type": "string",
            "enum": [
              "COMPLETED",
              "NOT_COMPLETED"
            ]
          },
          "weightSnapshot": {
            "type": "number"
          },
